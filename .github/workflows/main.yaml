name: Log output GitOps

on:
  push:
    branches:
      - main
    paths:
      - "log-output/**"
      - "greeter/**"
      - "ping-pong/**"
      - ".github/workflows/main.yaml"

permissions:
  contents: write
  packages: write

jobs:
  build-publish-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/antief/log-output
        run: |
          docker build \
            --tag "$IMAGE:$GITHUB_SHA" \
            ./log-output

          docker push "$IMAGE:$GITHUB_SHA"
          docker build --tag "$IMAGE:$GITHUB_SHA-ping-pong" ./ping-pong
          docker push "$IMAGE:$GITHUB_SHA-ping-pong"
          for version in 1 2; do
            image="ghcr.io/antief/log-output:$GITHUB_SHA-greeter-v$version"
            docker build --build-arg VERSION="$version" --tag "$image" ./greeter
            docker push "$image"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image
        working-directory: log-output
        run: |
          kustomize edit set image \
            log-output=ghcr.io/antief/log-output:$GITHUB_SHA \
            greeter-v1=ghcr.io/antief/log-output:$GITHUB_SHA-greeter-v1 \
            greeter-v2=ghcr.io/antief/log-output:$GITHUB_SHA-greeter-v2 \
            ping-pong=ghcr.io/antief/log-output:$GITHUB_SHA-ping-pong

      - name: Commit deployment update
        uses: EndBug/add-and-commit@v10
        with:
          add: log-output/kustomization.yaml
          message: "chore: update log-output image"
