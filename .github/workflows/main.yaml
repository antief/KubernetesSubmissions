name: Log output GitOps

on:
  push:
    branches:
      - main
    paths:
      - "log-output/**"
      - ".github/workflows/main.yaml"

permissions:
  contents: write
  packages: write

jobs:
  build-publish-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/antief/log-output
        run: |
          docker build \
            --tag "$IMAGE:$GITHUB_SHA" \
            ./log-output

          docker push "$IMAGE:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image
        working-directory: log-output
        run: |
          kustomize edit set image \
            log-output=ghcr.io/antief/log-output:$GITHUB_SHA

      - name: Commit deployment update
        uses: EndBug/add-and-commit@v10
        with:
          add: log-output/kustomization.yaml
          message: "chore: update log-output image"
