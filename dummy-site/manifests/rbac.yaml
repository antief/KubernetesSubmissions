apiVersion: v1
kind: ServiceAccount
metadata:
  name: dummy-site-controller
  namespace: exercises
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dummy-site-controller
rules:
  - apiGroups: [stable.dwk]
    resources: [dummysites]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dummy-site-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dummy-site-controller
subjects:
  - kind: ServiceAccount
    name: dummy-site-controller
    namespace: exercises
