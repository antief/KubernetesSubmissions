apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-backups
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-database-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: postgres:18.0
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              envFrom:
                - configMapRef:
                    name: todo-postgres-config
                - secretRef:
                    name: todo-postgres-secret
              command:
                - sh
                - -c
                - |
                  set -eu
                  backup="/backups/todo-$(date -u +%Y-%m-%dT%H-%M-%SZ).sql"
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
                    --host="$POSTGRES_HOST" \
                    --port="$POSTGRES_PORT" \
                    --username="$POSTGRES_USER" \
                    --dbname="$POSTGRES_DB" \
                    --file="$backup"
                  echo "Saved backup: $backup"
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: todo-backups
