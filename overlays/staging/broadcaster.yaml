apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
  namespace: project
spec:
  template:
    spec:
      containers:
      - name: broadcaster
        env:
        - name: NATS_SUBJECT
          value: todos.staging.events
        - name: FORWARD_WEBHOOK
          value: 'false'
        - name: WEBHOOK_URL
          $patch: delete
