apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong

  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: ping-pong-cpu

  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: europe-north1-docker.pkg.dev/dwk-gke-antti-6c49/dwk-images/ping-pong:4.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          env:
            - name: PORT
              value: "8000"

            - name: DATABASE_URL
              value: postgresql://pingpong@ping-pong-postgres-svc:5432/pingpong
