apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikipedia
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wikipedia
  template:
    metadata:
      labels:
        app: wikipedia
    spec:
      securityContext:
        fsGroup: 101
      volumes:
        - name: site
          emptyDir: {}
        - name: scripts
          configMap:
            name: wikipedia-scripts
      initContainers:
        - name: initial-page
          image: curlimages/curl:8.11.1
          command: [sh, /scripts/download.sh]
          args: [https://en.wikipedia.org/wiki/Kubernetes]
          volumeMounts:
            - name: site
              mountPath: /site
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: nginx
          image: nginx:1.31-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: refresh
          image: curlimages/curl:8.11.1
          command: [sh, /scripts/refresh.sh]
          volumeMounts:
            - name: site
              mountPath: /site
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
